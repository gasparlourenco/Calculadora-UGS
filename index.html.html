<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Avaliação Académica · UGS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bs-primary: #2563eb;
    --bs-primary-rgb: 37, 99, 235;
    --bs-body-bg: #f8fafc;
    --bs-body-color: #1e293b;
    --bs-secondary-color: #64748b;
    --bs-border-color: #e2e8f0;
    --bs-success: #059669;
    --bs-success-rgb: 5, 150, 105;
    --bs-warning: #d97706;
    --bs-warning-rgb: 217, 119, 6;
    --bs-danger: #dc2626;
    --bs-danger-rgb: 220, 38, 38;
    --bs-border-radius: 0.5rem;
    --bs-border-radius-sm: 0.375rem;
    --bs-border-radius-lg: 0.75rem;
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    -webkit-font-smoothing: antialiased;
  }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  .btn-primary {
    --bs-btn-bg: #2563eb;
    --bs-btn-border-color: #2563eb;
    --bs-btn-hover-bg: #1d4ed8;
    --bs-btn-hover-border-color: #1d4ed8;
    --bs-btn-active-bg: #1e40af;
    --bs-btn-active-border-color: #1e40af;
    --bs-btn-disabled-bg: #cbd5e1;
    --bs-btn-disabled-border-color: #cbd5e1;
    --bs-btn-disabled-color: #ffffff;
  }
  .btn-outline-primary {
    --bs-btn-color: #2563eb;
    --bs-btn-border-color: #2563eb;
    --bs-btn-hover-bg: #2563eb;
    --bs-btn-hover-border-color: #2563eb;
  }
  .btn { font-weight: 500; letter-spacing: -0.01em; }
  .btn-sm { padding: 0.375rem 0.75rem; }

  .card {
    border: 1px solid var(--bs-border-color);
    box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04);
  }
  .card-header { border-bottom: 1px solid var(--bs-border-color); padding: 0.875rem 1.125rem; }
  .card-body { padding: 1.25rem; }

  .form-control, .form-select {
    border-color: #cbd5e1;
    font-size: 0.875rem;
  }
  .form-control:focus, .form-select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgb(37 99 235 / 0.15);
  }
  .form-control.is-invalid:focus {
    box-shadow: 0 0 0 3px rgb(220 38 38 / 0.15);
  }
  .input-group-text { background: #f8fafc; border-color: #cbd5e1; color: #64748b; font-size: 0.8125rem; }
  .form-label { color: #334155; font-weight: 500; font-size: 0.8125rem; }

  .app-container { max-width: 1040px; }

  /* Navbar */
  .app-navbar {
    background: #ffffff;
    border-bottom: 1px solid var(--bs-border-color);
    box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.03);
  }
  .app-logo {
    width: 40px; height: 40px; border-radius: 0.625rem;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px rgb(37 99 235 / 0.25);
    flex-shrink: 0;
  }

  /* Stats */
  .stat-card { border: 1px solid var(--bs-border-color); background: #fff; border-radius: 0.625rem; padding: 0.875rem 1rem; }
  .stat-icon {
    width: 32px; height: 32px; border-radius: 0.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.875rem; flex-shrink: 0;
  }
  .stat-icon.primary   { background: #eff6ff; color: #2563eb; }
  .stat-icon.success   { background: #ecfdf5; color: #059669; }
  .stat-icon.danger    { background: #fef2f2; color: #dc2626; }
  .stat-icon.secondary { background: #f1f5f9; color: #475569; }

  /* Phase cards */
  .phase-card {
    border: 1px solid var(--bs-border-color);
    border-left-width: 4px;
    border-radius: 0.75rem;
    background: #fff;
    transition: box-shadow 0.2s, border-color 0.2s;
    overflow: hidden;
  }
  .phase-card.active  { border-left-color: #2563eb; }
  .phase-card.closed  { border-left-color: #059669; background: #fcfdfd; }
  .phase-card.ready   { border-left-color: #10b981; box-shadow: 0 1px 3px rgb(16 185 129 / 0.1); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    padding: 1rem 1.125rem;
    border-bottom: 1px solid var(--bs-border-color);
  }
  .phase-number {
    width: 36px; height: 36px; border-radius: 50%;
    background: #eff6ff; color: #2563eb;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9375rem;
    flex-shrink: 0;
  }
  .phase-card.closed .phase-number { background: #d1fae5; color: #059669; }
  .phase-card.ready .phase-number  { background: #d1fae5; color: #059669; }
  .phase-title { flex: 1; min-width: 0; }
  .phase-title h6 { margin: 0; font-weight: 600; font-size: 0.9375rem; color: #0f172a; }
  .phase-title small { color: #64748b; font-size: 0.75rem; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 0.25rem;
    padding: 0.25rem 0.5rem; border-radius: 0.375rem;
    font-size: 0.6875rem; font-weight: 600;
    white-space: nowrap;
  }
  .status-badge.pending  { background: #f1f5f9; color: #64748b; }
  .status-badge.progress { background: #fef3c7; color: #92400e; }
  .status-badge.ready    { background: #d1fae5; color: #065f46; }
  .status-badge.closed   { background: #d1fae5; color: #065f46; }

  code.calc {
    display: block; padding: 0.625rem 0.875rem;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 0.5rem;
    font-family: 'SFMono-Regular', 'Menlo', 'Consolas', monospace;
    font-size: 0.78125rem; color: #334155; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }

  .process-row { cursor: pointer; transition: background 0.15s; }
  .process-row:hover { background: #f8fafc; }

  .autosave-badge {
    font-size: 0.6875rem; color: #64748b;
    display: inline-flex; align-items: center; gap: 0.25rem;
    transition: color 0.2s;
  }
  .autosave-badge.saving { color: #2563eb; }

  .ac-input-group .input-group-text { background: #f8fafc; }

  .result-icon {
    width: 64px; height: 64px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .field-error {
    display: none;
    font-size: 0.75rem;
    color: #dc2626;
    margin-top: 0.25rem;
  }
  .field-error.show { display: block; }

  .hint-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 0.5rem;
    padding: 0.625rem 0.875rem;
    font-size: 0.8125rem;
    color: #475569;
    display: flex; align-items: flex-start; gap: 0.5rem;
  }
  .hint-box.warning { background: #fffbeb; border-color: #fde68a; color: #92400e; }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff !important; }
    .card, .phase-card { border: 1px solid #dee2e6 !important; box-shadow: none !important; }
  }

  /* Refinamento visual: hierarquia, conforto e experiência mobile */
  :root {
    --brand-ink: #14233b;
    --brand-blue: #3157d5;
    --brand-blue-dark: #2445b8;
    --surface: #ffffff;
    --surface-soft: #f4f7fc;
    --line-soft: #e6ebf3;
  }
  body { background: #f4f6fb; color: var(--brand-ink); line-height: 1.55; }
  .app-navbar {
    position: sticky; top: 0; z-index: 1020;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(14px);
    border-bottom-color: #e7ecf4;
  }
  .app-logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(145deg, #4169ed, #233fae);
    box-shadow: 0 7px 18px rgba(49,87,213,.2);
  }
  .app-container { max-width: 1120px; }
  main.app-container { padding-top: clamp(1.25rem, 3vw, 2.25rem) !important; }
  h4 { font-size: clamp(1.35rem, 3vw, 1.75rem); letter-spacing: -.035em !important; }
  .card, .phase-card, .stat-card {
    border-color: var(--line-soft); border-radius: 16px;
    box-shadow: 0 5px 20px rgba(22, 40, 75, .035);
  }
  .card-header { background: #fff; }
  .card-body { padding: clamp(1rem, 3vw, 1.5rem); }
  .stat-card { padding: 1rem; min-height: 76px; transition: transform .18s ease, box-shadow .18s ease; }
  .stat-icon { width: 38px; height: 38px; border-radius: 12px; font-size: 1rem; }
  .phase-card { border-left-width: 4px; }
  .phase-header { padding: 1.1rem clamp(.9rem, 3vw, 1.25rem); gap: .75rem; }
  .phase-number { width: 40px; height: 40px; border-radius: 13px; }
  .phase-title h6 { font-size: 1rem; letter-spacing: -.015em; }
  .phase-title small { display: inline-block; margin-top: 3px; line-height: 1.4; }
  .status-badge { max-width: 100%; white-space: normal; line-height: 1.35; }
  .btn {
    min-height: 38px; border-radius: 10px; transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary {
    --bs-btn-bg: #3157d5; --bs-btn-border-color: #3157d5;
    --bs-btn-hover-bg: #2445b8; --bs-btn-hover-border-color: #2445b8;
    --bs-btn-active-bg: #1d399d; --bs-btn-active-border-color: #1d399d;
    box-shadow: 0 3px 8px rgba(49,87,213,.12);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-sm { min-height: 34px; }
  .form-control, .form-select, .input-group-text {
    min-height: 42px; border-radius: 10px; font-size: .925rem;
  }
  .input-group > .form-control, .input-group > .form-select,
  .input-group > .input-group-text { border-radius: 10px; }
  .input-group > :not(:first-child) { margin-left: 4px; }
  .form-label { margin-bottom: .45rem; font-size: .82rem; }
  .form-control:focus, .form-select:focus {
    border-color: #6e8af0; box-shadow: 0 0 0 4px rgba(49,87,213,.12);
  }
  .hint-box { border-radius: 12px; padding: .85rem 1rem; line-height: 1.5; }
  code.calc { border-radius: 12px; padding: .85rem 1rem; }
  .table { --bs-table-hover-bg: #f6f8fd; }
  .table thead th { padding-top: .9rem; padding-bottom: .9rem; font-size: .75rem; }
  .table tbody td { padding-top: .9rem; padding-bottom: .9rem; }
  .process-row { transition: background .15s ease; }
  .process-row:hover { background: #f7f9fe; }
  footer { border-color: var(--line-soft) !important; }
  .modal-content { border-radius: 18px; overflow: hidden; }
  .toast { backdrop-filter: blur(10px); }
  :focus-visible { outline: 3px solid rgba(49,87,213,.35); outline-offset: 2px; }
  @media (min-width: 768px) {
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22,40,75,.07); }
  }
  @media (max-width: 767.98px) {
    .app-navbar .container { padding-left: 1rem; padding-right: 1rem; }
    .app-logo { width: 40px; height: 40px; border-radius: 12px; }
    .app-navbar .fw-bold { font-size: .93rem !important; line-height: 1.25; }
    .app-navbar .text-uppercase { font-size: .57rem !important; }
    main.app-container { padding-left: 1rem; padding-right: 1rem; }
    .stat-card { padding: .8rem; gap: .65rem !important; }
    .stat-icon { width: 34px; height: 34px; }
    .stat-card .fw-bold { font-size: 1.15rem !important; }
    .phase-header { align-items: flex-start; flex-wrap: wrap; }
    .phase-title { flex: 1 1 calc(100% - 60px); }
    .phase-header .status-badge { margin-left: 52px; }
    .btn-group { display: flex; width: 100%; }
    .btn-group > .btn { flex: 1; white-space: normal; }
    #btn-novo { min-height: 42px; }
    /* A tabela transforma-se em cartões legíveis em ecrãs pequenos. */
    .table-responsive { overflow: visible; }
    .table-responsive table, .table-responsive tbody { display: block; width: 100%; }
    .table-responsive thead { display: none; }
    .table-responsive tbody { display: grid; gap: .75rem; padding: .75rem; }
    .table-responsive tbody tr {
      display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem;
      padding: .9rem; border: 1px solid var(--line-soft); border-radius: 14px;
      background: #fff; box-shadow: 0 3px 12px rgba(22,40,75,.035);
      cursor: pointer;
    }
    .table-responsive tbody td {
      display: block !important; border: 0; padding: .1rem 0 !important;
      min-width: 0; text-align: left !important; overflow-wrap: anywhere;
    }
    .table-responsive tbody td:first-child { grid-column: 1 / -1; padding-bottom: .55rem !important; border-bottom: 1px solid #eef1f7; }
    .table-responsive tbody td:nth-child(3) { grid-column: 1 / -1; }
    .table-responsive tbody td:last-child {
      position: absolute; /* overridden below by grid placement */
    }
    .table-responsive tbody tr { position: relative; }
    .table-responsive tbody td:last-child {
      position: static; grid-column: 1 / -1; display: flex !important;
      justify-content: flex-end; border-top: 1px solid #eef1f7; padding-top: .35rem !important;
    }
    .table-responsive tbody td .badge { white-space: normal; text-align: left; line-height: 1.45; }
    .table-responsive tbody td:nth-child(4)::before,
    .table-responsive tbody td:nth-child(5)::before,
    .table-responsive tbody td:nth-child(6)::before {
      display: block; color: #748198; font-size: .68rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .045em; margin-bottom: .12rem;
    }
    .table-responsive tbody td:nth-child(4)::before { content: "NF₁"; }
    .table-responsive tbody td:nth-child(5)::before { content: "NF₂"; }
    .table-responsive tbody td:nth-child(6)::before { content: "Recurso"; }
    .table-responsive tbody td:nth-child(4),
    .table-responsive tbody td:nth-child(5),
    .table-responsive tbody td:nth-child(6) { display: block !important; }
    .table-responsive tbody td:nth-child(4).d-none,
    .table-responsive tbody td:nth-child(5).d-none,
    .table-responsive tbody td:nth-child(6).d-none { display: block !important; }
    .table-responsive tbody td:nth-child(2) { display: none !important; }
    .table-responsive tbody td:nth-child(4) { grid-column: 1; }
    .table-responsive tbody td:nth-child(5) { grid-column: 2; }
    .table-responsive tbody td:nth-child(6) { grid-column: 1 / -1; }
    .table-responsive tbody td:first-child .fw-medium { font-size: .98rem; }
    .table-responsive tbody td:first-child .text-secondary { margin-top: .2rem; }
    .table-responsive tbody td:last-child button { min-width: 40px; min-height: 40px; }
    #filtro-text, #filtro-estado, #btn-clear { min-height: 42px; }
    .d-flex.justify-content-between.align-items-center.mt-3 { align-items: flex-start !important; }
    #btn-export, #btn-clear-all { min-height: 36px; }
    .modal-dialog { margin: .75rem; }
    .modal-footer { gap: .5rem; }
    .modal-footer .btn { flex: 1; }
    .result-icon { width: 56px; height: 56px; }
  }
  @media (max-width: 380px) {
    .app-navbar .text-uppercase { letter-spacing: .035em !important; }
    .stat-card { padding: .65rem; }
    .stat-icon { width: 30px; height: 30px; }
    .phase-header .status-badge { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }


  /* Ajustes finais de utilização em telemóveis reais */
  html { -webkit-text-size-adjust: 100%; }
  img, svg, canvas, video { max-width: 100%; }
  .app-container, #view, .card, .card-body { min-width: 0; }
  .text-break, .form-text, .hint-box { overflow-wrap: anywhere; }
  @media (max-width: 767.98px) {
    body { font-size: 15px; }
    .app-navbar { backdrop-filter: none; }
    .app-navbar .d-flex.align-items-center.gap-3 { gap: .65rem !important; }
    .app-navbar .fw-bold { max-width: calc(100vw - 100px); }
    .btn, .form-select, .form-control { touch-action: manipulation; }
    /* Evita o zoom automático dos campos no Safari/iOS. */
    input.form-control, select.form-select, textarea.form-control { font-size: 16px; }
    .modal { padding: 0 !important; }
    .modal-dialog { width: auto; max-width: none; margin: .5rem; }
    .modal-content { max-height: calc(100dvh - 1rem); }
    .modal-body { overflow-y: auto; overscroll-behavior: contain; }
    .modal-footer { flex-wrap: wrap; }
    .modal-footer .btn { min-height: 44px; }
    .table-responsive tbody { padding: .6rem; }
    .table-responsive tbody tr { padding: .8rem; }
    .table-responsive tbody td:last-child button,
    #btn-novo, #btn-clear, #btn-ident-confirm { min-height: 44px; }
    .d-flex.justify-content-between.align-items-center.mt-3 > div { flex-wrap: wrap; }
  }
  @media (max-width: 360px) {
    main.app-container { padding-left: .75rem; padding-right: .75rem; }
    .app-navbar .container { padding-left: .75rem; padding-right: .75rem; }
    .stat-card { gap: .45rem !important; }
    .stat-card .text-uppercase { font-size: .56rem !important; }
    .phase-header .status-badge { margin-left: 0; }
  }
  /* ═══════════════════════════════════════════════════════════
   REFINAMENTO MOBILE — correcções focadas
   (adicionar ao final do <style>, depois das regras existentes)
   ═══════════════════════════════════════════════════════════ */

@media (max-width: 767.98px) {

  /* ─ 1. Mostrar UC/semestre nos cards de processo
        (estavam ocultos; sem isto não se sabe de que UC é cada linha) */
  .table-responsive tbody td:nth-child(2) {
    display: block !important;
    grid-column: 1 / -1;
    padding: .15rem 0 .55rem !important;
    border-bottom: 1px solid #eef1f7;
    margin-bottom: .15rem;
  }
  .table-responsive tbody td:nth-child(2) > div:first-child {
    font-weight: 500;
    color: #334155;
  }

  /* ─ 2. Phase header com grid: número à esquerda, título em cima,
        badge de estado em linha própria alinhado ao título */
  .phase-header {
    display: grid !important;
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: .75rem;
    row-gap: .4rem;
    flex-wrap: unset;
  }
  .phase-header .phase-number {
    grid-column: 1;
    grid-row: 1 / 3;
    align-self: start;
  }
  .phase-header .phase-title {
    grid-column: 2;
    grid-row: 1;
    flex: unset;
    min-width: 0;
  }
  .phase-header .status-badge {
    grid-column: 2;
    grid-row: 2;
    margin-left: 0 !important;
    justify-self: start;
    white-space: normal;
    text-align: left;
    max-width: 100%;
  }

  /* ─ 3. Botão "Fechar Fase" + hint: empilhar em coluna,
        botão em baixo com largura total */
  .phase-card .card-body > .d-flex.justify-content-between.align-items-center.flex-wrap {
    flex-direction: column;
    align-items: stretch !important;
  }
  .phase-card .card-body > .d-flex.justify-content-between.align-items-center.flex-wrap > .small {
    text-align: left;
    margin-bottom: .5rem;
  }
  .phase-card .card-body > .d-flex.justify-content-between.align-items-center.flex-wrap > .btn {
    width: 100%;
  }

  /* ─ 4. Header da ficha de edição (título + acções):
        empilhar acções por baixo, alinhadas à direita */
  #view > div > .d-flex.justify-content-between.align-items-start.mb-4 {
    flex-direction: column;
    align-items: stretch !important;
    gap: .75rem !important;
  }
  #view > div > .d-flex.justify-content-between.align-items-start.mb-4 > div:last-child {
    justify-content: flex-end;
  }

  /* ─ 5. Esconder o símbolo decorativo do campo de pesquisa */
  .search-field kbd { display: none; }
}

@media (max-width: 575.98px) {

  /* ─ 6. Hero mais compacta em phones */
  .dashboard-hero { padding: 1.1rem 1rem !important; }
  .dashboard-hero h1 { font-size: 1.3rem !important; }
  .dashboard-hero p  { font-size: .8rem !important; }
  .hero-actions .btn { font-size: .78rem !important; min-height: 40px; }

  /* ─ 7. Recent items com avatar ligeiramente maior */
  .recent-avatar { flex: 0 0 38px; width: 38px; height: 38px; }
  .recent-item   { padding: .85rem; }

  /* ─ 8. Resultado final: forçar botões full-width */
  #print-area .no-print.d-flex.flex-sm-row > .btn {
    width: 100%;
    flex: 0 0 auto;
  }
}

@media (max-width: 380px) {

  /* ─ 9. Input group das ACs em ecrãs muito estreitos */
  .ac-input-group .input-group-text {
    padding: .3rem .35rem;
    font-size: .72rem;
  }
  .ac-input-group .input-group-text:first-of-type {
    min-width: 42px;
  }
  .ac-input-group .btn-outline-danger {
    padding: .25rem .35rem;
  }

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   CONSTANTES
   ═══════════════════════════════════════════════════════════ */
const LS_KEY = 'ugs:v1:processes';
const SS_ACTIVE = 'ugs:v1:active-id';
const MAX_PROCESSES = 500;

/* ═══════════════════════════════════════════════════════════
   FÓRMULAS
   ═══════════════════════════════════════════════════════════ */
const roundHalfUp       = n => Math.floor(n + 0.5);
const calcNF1           = (mac, cpf) => 0.6 * (4 * mac) + 0.4 * cpf;
const calcNF2           = (nf1G, ex) => 0.6 * nf1G + 0.4 * ex;
const isDispensado      = nfG => nfG >= 14;
const isAprovadoRecurso = nota => roundHalfUp(nota) >= 10;
const exameNecessario   = nf1G => Math.max(0, (13.5 - 0.6 * nf1G) / 0.4);

/* ═══════════════════════════════════════════════════════════
   UTILITÁRIOS
   ═══════════════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => (n == null || !Number.isFinite(n)) ? '—' : Number(n).toFixed(d).replace('.', ',');
const uid = () => (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(36).slice(2, 8);
const fmtDate = iso => {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch { return '—'; }
};

/**
 * Parse numérico rigoroso.
 * - Aceita vírgula ou ponto como separador decimal.
 * - Aceita espaços em volta (trim).
 * - Rejeita notação científica, hex, vazio, ".", "-".
 * - Limita a `maxDecimals` casas decimais.
 * - Devolve número ou null.
 */
function parseNum(v, maxDecimals = 2) {
  if (v == null) return null;
  const s = String(v).trim().replace(',', '.');
  if (s === '' || s === '.' || s === '-') return null;
  if (!/^-?\d*\.?\d*$/.test(s)) return null;
  const parts = s.split('.');
  if (parts[1] && parts[1].length > maxDecimals) return null;
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}

function validateField(value, { min, max, required = true, maxDecimals = 2, label = 'valor' }) {
  const s = value == null ? '' : String(value).trim();
  if (s === '') {
    if (required) return { valid: false, msg: 'Campo obrigatório' };
    return { valid: true, num: null };
  }
  const num = parseNum(s, maxDecimals);
  if (num === null) return { valid: false, msg: `Valor inválido (máx. ${maxDecimals} casas decimais)` };
  if (num < min) return { valid: false, msg: `Mínimo: ${fmt(min)}` };
  if (num > max) return { valid: false, msg: `Máximo: ${fmt(max)}` };
  return { valid: true, num };
}

function showToast(msg, kind = 'success') {
  const el = $('#toast-el');
  el.className = `toast align-items-center border-0 text-bg-${kind === 'error' ? 'danger' : 'dark'}`;
  const icon = $('#toast-icon');
  icon.className = `bi ${kind === 'error' ? 'bi-exclamation-circle-fill' : 'bi-check-circle-fill'}`;
  $('#toast-msg').textContent = msg;
  bootstrap.Toast.getOrCreateInstance(el).show();
}

/* ═══════════════════════════════════════════════════════════
   MODELO
   ═══════════════════════════════════════════════════════════ */
function novoProcesso({ aluno, numero, uc, semestre }) {
  const now = new Date().toISOString();
  return {
    id: uid(),
    aluno: aluno.trim(), numero: (numero || '').trim(),
    uc: (uc || '').trim(), semestre: (semestre || '').trim(),
    criadoEm: now, actualizadoEm: now,
    macMode: 'list',
    acs: [''],
    macDirect: '',
    cpf: '',
    fase1Fechada: false, nf1: null, nf1G: null, fase1FechadaEm: null,
    exame: '',
    fase2Fechada: false, nf2: null, nf2G: null, fase2FechadaEm: null,
    recurso: '',
    fase3Fechada: false, fase3FechadaEm: null,
    resultado: null,
  };
}

/* ═══════════════════════════════════════════════════════════
   PERSISTÊNCIA (com tratamento de quota)
   ═══════════════════════════════════════════════════════════ */
function loadAll() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch {
    return [];
  }
}
function saveAll(arr) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(arr.slice(0, MAX_PROCESSES)));
    return true;
  } catch (e) {
    if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
      showToast('Espaço de armazenamento esgotado. Apaga processos antigos.', 'error');
    } else {
      showToast('Erro ao guardar dados no dispositivo.', 'error');
    }
    return false;
  }
}
function getProcess(id) {
  if (!id) return null;
  return loadAll().find(p => p.id === id) || null;
}
function upsertProcess(p) {
  const all = loadAll();
  const idx = all.findIndex(x => x.id === p.id);
  p.actualizadoEm = new Date().toISOString();
  if (idx >= 0) all[idx] = p; else all.unshift(p);
  all.sort((a, b) => (b.actualizadoEm || '').localeCompare(a.actualizadoEm || ''));
  return saveAll(all);
}
function removeProcess(id) {
  return saveAll(loadAll().filter(p => p.id !== id));
}

/* ═══════════════════════════════════════════════════════════
   ESTADO DERIVADO
   ═══════════════════════════════════════════════════════════ */
function estadoProcesso(p) {
  if (p.resultado) return 'FINALIZADO';
  if (!p.fase1Fechada) return 'EM_FASE_1';
  if (!p.fase2Fechada) return 'EM_FASE_2';
  if (!p.fase3Fechada) return 'EM_FASE_3';
  return 'FINALIZADO';
}
function estadoLabel(p) {
  const e = estadoProcesso(p);
  if (e === 'FINALIZADO') {
    return {
      DISPENSADO_F1:    'Dispensado · 1ª fase',
      DISPENSADO_F2:    'Dispensado · 2ª fase',
      APROVADO_RECURSO: 'Aprovado · recurso',
      REPROVADO:        'Reprovado',
    }[p.resultado] || 'Finalizado';
  }
  return { EM_FASE_1: 'Em curso · Fase 1', EM_FASE_2: 'Em curso · Fase 2', EM_FASE_3: 'Em curso · Fase 3' }[e];
}
function estadoBadgeClass(p) {
  if (estadoProcesso(p) === 'FINALIZADO') {
    return p.resultado === 'REPROVADO' ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success';
  }
  return 'bg-primary-subtle text-primary';
}

/* ═══════════════════════════════════════════════════════════
   VALIDAÇÃO / CÁLCULO
   ═══════════════════════════════════════════════════════════ */
function getACs(p) {
  if (p.macMode === 'direct') {
    const v = parseNum(p.macDirect);
    return (v != null && v >= 0 && v <= 5) ? [v] : null;
  }
  if (!Array.isArray(p.acs) || p.acs.length === 0) return null;
  const arr = [];
  for (const v of p.acs) {
    const n = parseNum(v);
    if (n == null || n < 0 || n > 5) return null;
    arr.push(n);
  }
  return arr;
}
const getMAC = p => { const a = getACs(p); return a ? a.reduce((s, n) => s + n, 0) / a.length : null; };

function validateF1(p) {
  const issues = [];
  const mac = getMAC(p);
  const cpf = parseNum(p.cpf);
  if (mac == null) {
    if (p.macMode === 'direct') {
      if (parseNum(p.macDirect) == null) issues.push('Introduz o MAC');
    } else {
      if (!Array.isArray(p.acs) || p.acs.length === 0) issues.push('Introduz pelo menos uma AC');
      else {
        const empty = p.acs.findIndex(v => String(v || '').trim() === '');
        if (empty >= 0) issues.push(`Falta preencher AC ${empty + 1}`);
        const invalid = p.acs.findIndex(v => parseNum(v) == null || parseNum(v) < 0 || parseNum(v) > 5);
        if (invalid >= 0 && empty < 0) issues.push(`AC ${invalid + 1} fora de 0–5`);
      }
    }
  }
  if (cpf == null) issues.push('Introduz o CPF');
  else if (cpf < 0 || cpf > 20) issues.push('CPF fora de 0–20');
  return { ok: issues.length === 0, issues };
}
function validateF2(p) {
  const ex = parseNum(p.exame);
  if (ex == null) return { ok: false, issues: ['Introduz a nota do exame'] };
  if (ex < 0 || ex > 20) return { ok: false, issues: ['Exame fora de 0–20'] };
  return { ok: true, issues: [] };
}
function validateF3(p) {
  const r = parseNum(p.recurso);
  if (r == null) return { ok: false, issues: ['Introduz a nota do recurso'] };
  if (r < 0 || r > 20) return { ok: false, issues: ['Recurso fora de 0–20'] };
  return { ok: true, issues: [] };
}

const podeFecharF1 = p => validateF1(p).ok;
const podeFecharF2 = p => validateF2(p).ok;
const podeFecharF3 = p => validateF3(p).ok;

/* Status visual da fase (para o badge do header) */
function phase1Status(p) {
  if (p.fase1Fechada) return { cls: 'closed', icon: 'bi-lock-fill', text: `Fechada · NF₁ = ${p.nf1G}` };
  const v = validateF1(p);
  if (v.ok) return { cls: 'ready', icon: 'bi-check-circle-fill', text: 'Pronto para fechar' };
  const hasSomething = (getMAC(p) != null) || parseNum(p.cpf) != null || (p.macMode === 'direct' && p.macDirect);
  if (!hasSomething) return { cls: 'pending', icon: 'bi-circle', text: 'Por começar' };
  return { cls: 'progress', icon: 'bi-hourglass-split', text: v.issues[0] };
}
function phase2Status(p) {
  if (p.fase2Fechada) return { cls: 'closed', icon: 'bi-lock-fill', text: `Fechada · NF₂ = ${p.nf2G}` };
  const v = validateF2(p);
  if (v.ok) return { cls: 'ready', icon: 'bi-check-circle-fill', text: 'Pronto para fechar' };
  return { cls: 'progress', icon: 'bi-hourglass-split', text: v.issues[0] };
}
function phase3Status(p) {
  if (p.fase3Fechada) return { cls: 'closed', icon: 'bi-lock-fill', text: 'Fechada' };
  const v = validateF3(p);
  if (v.ok) return { cls: 'ready', icon: 'bi-check-circle-fill', text: 'Pronto para fechar' };
  return { cls: 'progress', icon: 'bi-hourglass-split', text: v.issues[0] };
}

/* ═══════════════════════════════════════════════════════════
   ACÇÕES DE FASE
   ═══════════════════════════════════════════════════════════ */
function fecharFase1(p) {
  if (!podeFecharF1(p)) return false;
  p.nf1 = calcNF1(getMAC(p), parseNum(p.cpf));
  p.nf1G = roundHalfUp(p.nf1);
  p.fase1Fechada = true;
  p.fase1FechadaEm = new Date().toISOString();
  if (isDispensado(p.nf1G)) p.resultado = 'DISPENSADO_F1';
  return true;
}
function fecharFase2(p) {
  if (!podeFecharF2(p)) return false;
  p.nf2 = calcNF2(p.nf1G, parseNum(p.exame));
  p.nf2G = roundHalfUp(p.nf2);
  p.fase2Fechada = true;
  p.fase2FechadaEm = new Date().toISOString();
  if (isDispensado(p.nf2G)) p.resultado = 'DISPENSADO_F2';
  return true;
}
function fecharFase3(p) {
  if (!podeFecharF3(p)) return false;
  p.fase3Fechada = true;
  p.fase3FechadaEm = new Date().toISOString();
  p.resultado = isAprovadoRecurso(parseNum(p.recurso)) ? 'APROVADO_RECURSO' : 'REPROVADO';
  return true;
}
function reabrirFase1(p) {
  const tem = p.fase2Fechada || p.exame !== '' || p.fase3Fechada || p.recurso !== '';
  if (tem && !confirm('Reabrir a Fase 1 apaga o exame, o recurso e o resultado final. Continuar?')) return false;
  p.fase1Fechada = false; p.nf1 = null; p.nf1G = null; p.fase1FechadaEm = null;
  p.exame = ''; p.fase2Fechada = false; p.nf2 = null; p.nf2G = null; p.fase2FechadaEm = null;
  p.recurso = ''; p.fase3Fechada = false; p.fase3FechadaEm = null;
  p.resultado = null;
  return true;
}
function reabrirFase2(p) {
  const tem = p.fase3Fechada || p.recurso !== '';
  if (tem && !confirm('Reabrir a Fase 2 apaga o recurso e o resultado final. Continuar?')) return false;
  p.fase2Fechada = false; p.nf2 = null; p.nf2G = null; p.fase2FechadaEm = null;
  p.recurso = ''; p.fase3Fechada = false; p.fase3FechadaEm = null;
  p.resultado = null;
  return true;
}
function reabrirFase3(p) {
  if (!confirm('Reabrir a Fase 3 apaga o resultado final. Continuar?')) return false;
  p.fase3Fechada = false; p.fase3FechadaEm = null;
  p.resultado = null;
  return true;
}

   NAVEGAÇÃO
   ═══════════════════════════════════════════════════════════ */
const ui = { view: 'list', activeId: null, filter: '', filterEstado: '' };
try { ui.activeId = sessionStorage.getItem(SS_ACTIVE) || null; } catch {}

function openProcess(id) {
  if (!getProcess(id)) { closeProcess(); return; }
  ui.view = 'edit'; ui.activeId = id;
  try { sessionStorage.setItem(SS_ACTIVE, id); } catch {}
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function closeProcess() {
  flushPendingSave();
  ui.view = 'list'; ui.activeId = null;
  try { sessionStorage.removeItem(SS_ACTIVE); } catch {}
  render();
}
function currentProcess() { return ui.activeId ? getProcess(ui.activeId) : null; }

/* ═══════════════════════════════════════════════════════════
   AUTO-SAVE
   ═══════════════════════════════════════════════════════════ */
let saveTimer = null;
let activeProcessRef = null;

function autosave(p) {
  clearTimeout(saveTimer);
  const badge = $('#autosave-badge');
  if (badge) { badge.classList.add('saving'); badge.innerHTML = `<i class="bi bi-arrow-repeat"></i> A guardar…`; }
  saveTimer = setTimeout(() => {
    saveTimer = null;
    if (upsertProcess(p)) refreshSaveBadge();
  }, 400);
}
function saveNow(p) {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  if (upsertProcess(p)) refreshSaveBadge();
}
function refreshSaveBadge() {
  const b = $('#autosave-badge');
  if (!b) return;
  b.classList.remove('saving');
  b.innerHTML = `<i class="bi bi-check2"></i> Guardado ${new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' })}`;
}
function flushPendingSave() {
  if (saveTimer && activeProcessRef) {
    clearTimeout(saveTimer); saveTimer = null;
    upsertProcess(activeProcessRef);
  }
}
window.addEventListener('beforeunload', flushPendingSave);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushPendingSave();
});

      </div>

        : `<div class="card process-table-card"><div class="table-responsive">

    = ${fmt(0.6 * 4 * mac)} + ${fmt(0.4 * cpf)}
    = <strong>${fmt(p.nf1)}</strong> → arredondado <strong>${p.nf1G}</strong></code>
        </div>
        ${showNF2 ? `<div>
          <div class="fw-semibold mb-1" style="color: #0f172a;">Fase 2 · Exame</div>
          <code class="calc">NF₂ = 0.6 × ${p.nf1G} + 0.4 × ${fmt(exame)}
    = ${fmt(0.6 * p.nf1G)} + ${fmt(0.4 * exame)}
    = <strong>${fmt(p.nf2)}</strong> → arredondado <strong>${p.nf2G}</strong></code>
        </div>` : ''}
        ${showRec ? `<div>
          <div class="fw-semibold mb-1" style="color: #0f172a;">Fase 3 · Recurso</div>

/* ═══════════════════════════════════════════════════════════
   BIND — LISTA
   ═══════════════════════════════════════════════════════════ */
function bindList() {
  $('#btn-novo')?.addEventListener('click', () => openIdentModal());
  $('#nav-btn-novo')?.addEventListener('click', () => openIdentModal());
  const doExport = () => exportCSV();
  $('#nav-btn-export')?.addEventListener('click', doExport);
  $('#hero-btn-export')?.addEventListener('click', doExport);
  $('#btn-clear-empty')?.addEventListener('click', () => { ui.filter = ''; ui.filterEstado = ''; renderListOnly(); });
  $('#btn-novo-empty')?.addEventListener('click', () => openIdentModal());
  $('#filtro-text')?.addEventListener('input', e => { const value = e.target.value; const start = e.target.selectionStart; const end = e.target.selectionEnd; ui.filter = value; renderListOnly(); const next = $('#filtro-text'); if (next) { next.focus({ preventScroll: true }); try { next.setSelectionRange(start, end); } catch {} } });
  $('#filtro-estado')?.addEventListener('change', e => { ui.filterEstado = e.target.value; renderListOnly(); });
  $('#btn-clear')?.addEventListener('click', () => { ui.filter = ''; ui.filterEstado = ''; renderListOnly(); });

  $$('[data-open]').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.closest('[data-del]')) return;
      openProcess(tr.dataset.open);
    });
  });

  $$('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const p = getProcess(btn.dataset.del);
      if (!p) return;
      const aviso = p.resultado ? `\n\n⚠️ Este processo já tem resultado final (${estadoLabel(p)}).` : '';
      if (confirm(`Apagar o processo de "${p.aluno}"?${aviso}\n\nEsta acção não pode ser desfeita.`)) {
        removeProcess(p.id);
        if (ui.activeId === p.id) closeProcess();
        showToast('Processo apagado.');
        render();
      }
    });
  });

  $('#btn-clear-all')?.addEventListener('click', () => {
    const all = loadAll();
    if (!all.length) return;
    if (confirm(`Apagar TODOS os ${all.length} processos?\n\nEsta acção não pode ser desfeita.`)) {
      saveAll([]);
      closeProcess();
      showToast('Todos os processos apagados.');
    }
  });

  $('#btn-export')?.addEventListener('click', () => exportCSV());
}

function renderListOnly() {
  activeProcessRef = null;
  $('#view').innerHTML = renderList();
  bindList();
}

/* ═══════════════════════════════════════════════════════════
   BIND — EDIÇÃO
   ═══════════════════════════════════════════════════════════ */
function bindEdit(p) {
  activeProcessRef = p;

  $('#btn-back').addEventListener('click', () => closeProcess());
  $('#btn-edit-ident').addEventListener('click', () => openIdentModal(p.id));
  $('#btn-delete').addEventListener('click', () => {
    const aviso = p.resultado ? `\n\n⚠️ Este processo já tem resultado final.` : '';
    if (confirm(`Apagar o processo de "${p.aluno}"?${aviso}\n\nEsta acção não pode ser desfeita.`)) {
      removeProcess(p.id);
      closeProcess();
      showToast('Processo apagado.');
    }
  });

  refreshSaveBadge();

  /* FASE 1 */
  if (!p.fase1Fechada) {
    $$('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
      const m = btn.dataset.mode;
      if (m === p.macMode) return;
      if (m === 'direct') {
        const mac = getMAC(p);
        if (mac != null && !confirm('Converter para MAC directo? As ACs individuais serão substituídas pela média.')) return;
        if (mac != null) p.macDirect = mac.toFixed(2).replace('.', ',');
      } else {
        const n = parseNum(p.macDirect);
        if (n != null && n >= 0 && n <= 5) p.acs = [String(n)];
      }
      p.macMode = m;
      saveNow(p);
      render();
    }));

    $$('[data-ac]').forEach(inp => inp.addEventListener('input', () => {
      p.acs[+inp.dataset.ac] = inp.value;
      const v = parseNum(inp.value);
      const invalid = inp.value !== '' && (v == null || v < 0 || v > 5);
      inp.classList.toggle('is-invalid', invalid);
      autosave(p);
      updatePreviewF1(p);
      refreshF1Button(p);
    }));

    const macInp = $('#input-mac');
    if (macInp) macInp.addEventListener('input', () => {
      p.macDirect = macInp.value;
      const v = parseNum(macInp.value);
      const invalid = macInp.value !== '' && (v == null || v < 0 || v > 5);
      macInp.classList.toggle('is-invalid', invalid);
      autosave(p);
      updatePreviewF1(p);
      refreshF1Button(p);
    });

    const cpfInp = $('#input-cpf');
    if (cpfInp) cpfInp.addEventListener('input', () => {
      p.cpf = cpfInp.value;
      const v = parseNum(cpfInp.value);
      const invalid = cpfInp.value !== '' && (v == null || v < 0 || v > 20);
      cpfInp.classList.toggle('is-invalid', invalid);
      autosave(p);
      updatePreviewF1(p);
      refreshF1Button(p);
    });

    $('#btn-add-ac')?.addEventListener('click', () => {
      p.acs.push('');
      saveNow(p);
      render();
      const inputs = $$('[data-ac]');
      inputs[inputs.length - 1]?.focus();
    });

    $$('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
      if (p.acs.length <= 1) return;
      p.acs.splice(+btn.dataset.remove, 1);
      saveNow(p);
      render();
    }));

    $('#btn-fechar-f1').addEventListener('click', () => {
      const v = validateF1(p);
      if (!v.ok) { showToast(v.issues.join(' · '), 'error'); return; }
      if (!fecharFase1(p)) return;
      saveNow(p);
      showToast(p.resultado === 'DISPENSADO_F1' ? 'Dispensado na 1.ª fase!' : 'Fase 1 fechada.');
      render();
    });

    updatePreviewF1(p);
    refreshF1Button(p);
  } else {
    $('#btn-reabrir-f1')?.addEventListener('click', () => {
      if (reabrirFase1(p)) { saveNow(p); render(); }
    });
  }

  /* FASE 2 */
  if (p.fase1Fechada && !isDispensado(p.nf1G)) {
    if (!p.fase2Fechada) {
      const inp = $('#input-exame');
      if (inp) inp.addEventListener('input', () => {
        p.exame = inp.value;
        const v = parseNum(inp.value);
        inp.classList.toggle('is-invalid', inp.value !== '' && (v == null || v < 0 || v > 20));
        autosave(p);
        updatePreviewF2(p);
        refreshF2Button(p);
      });
      $('#btn-fechar-f2')?.addEventListener('click', () => {
        const v = validateF2(p);
        if (!v.ok) { showToast(v.issues.join(' · '), 'error'); return; }
        if (!fecharFase2(p)) return;
        saveNow(p);
        showToast(p.resultado === 'DISPENSADO_F2' ? 'Dispensado na 2.ª fase!' : 'Fase 2 fechada.');
        render();
      });
      updatePreviewF2(p);
      refreshF2Button(p);
    } else {
      $('#btn-reabrir-f2')?.addEventListener('click', () => {
        if (reabrirFase2(p)) { saveNow(p); render(); }
      });
    }
  }

  /* FASE 3 */
  if (p.fase2Fechada && !isDispensado(p.nf2G)) {
    if (!p.fase3Fechada) {
      const inp = $('#input-recurso');
      if (inp) inp.addEventListener('input', () => {
        p.recurso = inp.value;
        const v = parseNum(inp.value);
        inp.classList.toggle('is-invalid', inp.value !== '' && (v == null || v < 0 || v > 20));
        autosave(p);
        updatePreviewF3(p);
        refreshF3Button(p);
      });
      $('#btn-fechar-f3')?.addEventListener('click', () => {
        const v = validateF3(p);
        if (!v.ok) { showToast(v.issues.join(' · '), 'error'); return; }
        if (!fecharFase3(p)) return;
        saveNow(p);
        showToast(p.resultado === 'APROVADO_RECURSO' ? 'Aprovado no recurso!' : 'Reprovado.');
        render();
      });
      updatePreviewF3(p);
      refreshF3Button(p);
    } else {
      $('#btn-reabrir-f3')?.addEventListener('click', () => {
        if (reabrirFase3(p)) { saveNow(p); render(); }
      });
    }
  }

  /* RESULTADO */
  $('#btn-back-list')?.addEventListener('click', () => closeProcess());
  $('#btn-print')?.addEventListener('click', () => window.print());
}

function refreshF1Button(p) {
  const btn = $('#btn-fechar-f1');
  if (!btn) return;
  const v = validateF1(p);
  btn.disabled = !v.ok;
  const hint = btn.parentElement.querySelector('.small.text-secondary');
  if (hint) {
    hint.innerHTML = v.ok
      ? '<i class="bi bi-check-circle-fill text-success me-1"></i>Tudo pronto. Podes fechar a fase.'
      : `<i class="bi bi-info-circle me-1"></i>${v.issues.join(' · ')}`;
  }
  const badge = document.querySelector('.phase-card .status-badge');
  if (badge) {
    const s = phase1Status(p);
    badge.className = `status-badge ${s.cls}`;
    badge.innerHTML = `<i class="bi ${s.icon}"></i> ${s.text}`;
  }
}
function refreshF2Button(p) {
  const btn = $('#btn-fechar-f2');
  if (!btn) return;
  const v = validateF2(p);
  btn.disabled = !v.ok;
  const hint = btn.parentElement.querySelector('.small.text-secondary');
  if (hint) hint.innerHTML = v.ok
    ? '<i class="bi bi-check-circle-fill text-success me-1"></i>Pronto.'
    : `<i class="bi bi-info-circle me-1"></i>${v.issues.join(' · ')}`;
}
function refreshF3Button(p) {
  const btn = $('#btn-fechar-f3');
  if (!btn) return;
  const v = validateF3(p);
  btn.disabled = !v.ok;
  const hint = btn.parentElement.querySelector('.small.text-secondary');
  if (hint) hint.innerHTML = v.ok
    ? '<i class="bi bi-check-circle-fill text-success me-1"></i>Pronto.'
    : `<i class="bi bi-info-circle me-1"></i>${v.issues.join(' · ')}`;
}

function updatePreviewF1(p) {
  const el = $('#preview-f1'); if (!el) return;
  const mac = getMAC(p), cpf = parseNum(p.cpf);
  if (mac == null || cpf == null) {
    el.innerHTML = `<p class="small text-secondary mb-0"><i class="bi bi-info-circle me-1"></i>Preenche os campos para ver o cálculo em tempo real.</p>`; return;
  }
  if (mac < 0 || mac > 5 || cpf < 0 || cpf > 20) {
    el.innerHTML = `<p class="small text-danger mb-0"><i class="bi bi-exclamation-triangle me-1"></i>Corrige os valores assinalados.</p>`; return;
  }
  const nf1 = calcNF1(mac, cpf), nf1G = roundHalfUp(nf1);
  const disp = isDispensado(nf1G), need = exameNecessario(nf1G), feasible = need <= 20;
  el.innerHTML = `<div class="small">
    <div class="d-flex justify-content-between mb-1"><span class="text-secondary">MAC</span><span class="fw-semibold tabular-nums">${fmt(mac)}</span></div>
    <div class="d-flex justify-content-between"><span class="text-secondary">CPF</span><span class="fw-semibold tabular-nums">${fmt(cpf)}</span></div>
    <hr class="my-2">
    <code class="calc">NF₁ = 0.6 × (4 × ${fmt(mac)}) + 0.4 × ${fmt(cpf)} = <strong>${fmt(nf1)}</strong></code>
    <div class="d-flex justify-content-between align-items-center mt-2">
      <span class="text-secondary">Arredondado</span>
      <span class="fw-bold tabular-nums">${nf1G} <span class="badge ${disp ? 'bg-success' : 'bg-warning text-dark'} ms-1">${disp ? 'Dispensado' : 'Vai a exame'}</span></span>
    </div>
    ${!disp ? `<div class="mt-2 small text-secondary">${feasible ? `Para dispensar no exame precisas de <strong class="text-body">${fmt(need)}</strong>.` : `Mesmo com 20 no exame não dispensas.`}</div>` : ''}
  </div>`;
}

function updatePreviewF2(p) {
  const el = $('#preview-f2'); if (!el) return;
  const ex = parseNum(p.exame);
  if (ex == null) { el.innerHTML = `<p class="small text-secondary mb-0"><i class="bi bi-info-circle me-1"></i>Introduz a nota do exame.</p>`; return; }
  if (ex < 0 || ex > 20) { el.innerHTML = `<p class="small text-danger mb-0"><i class="bi bi-exclamation-triangle me-1"></i>Valor inválido.</p>`; return; }
  const nf2 = calcNF2(p.nf1G, ex), nf2G = roundHalfUp(nf2), disp = isDispensado(nf2G);
  el.innerHTML = `<div class="small">
    <div class="d-flex justify-content-between mb-1"><span class="text-secondary">NF₁ (guardado)</span><span class="fw-semibold tabular-nums">${p.nf1G}</span></div>
    <div class="d-flex justify-content-between"><span class="text-secondary">Exame</span><span class="fw-semibold tabular-nums">${fmt(ex)}</span></div>
    <hr class="my-2">
    <code class="calc">NF₂ = 0.6 × ${p.nf1G} + 0.4 × ${fmt(ex)} = <strong>${fmt(nf2)}</strong></code>
    <div class="d-flex justify-content-between align-items-center mt-2">
      <span class="text-secondary">Arredondado</span>
      <span class="fw-bold tabular-nums">${nf2G} <span class="badge ${disp ? 'bg-success' : 'bg-warning text-dark'} ms-1">${disp ? 'Dispensado' : 'Vai a recurso'}</span></span>
    </div>
  </div>`;
}

function updatePreviewF3(p) {
  const el = $('#preview-f3'); if (!el) return;
  const r = parseNum(p.recurso);
  if (r == null) { el.innerHTML = `<p class="small text-secondary mb-0"><i class="bi bi-info-circle me-1"></i>Introduz a nota do recurso.</p>`; return; }
  if (r < 0 || r > 20) { el.innerHTML = `<p class="small text-danger mb-0"><i class="bi bi-exclamation-triangle me-1"></i>Valor inválido.</p>`; return; }
  const rounded = roundHalfUp(r), pass = rounded >= 10;
  el.innerHTML = `<div class="small">
    <div class="d-flex justify-content-between mb-1"><span class="text-secondary">Nota do recurso</span><span class="fw-semibold tabular-nums">${fmt(r)}</span></div>
    <div class="d-flex justify-content-between"><span class="text-secondary">Após arredondamento</span><span class="fw-bold tabular-nums">${rounded}</span></div>
    <hr class="my-2">
    <div class="d-flex justify-content-between align-items-center">
      <span class="text-secondary">Resultado</span>
      <span class="badge ${pass ? 'bg-success' : 'bg-danger'}">${pass ? 'Aprovado' : 'Reprovado'}</span>
    </div>

}

/* ═══════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════ */
let identModalMode = { mode: 'new', id: null };

function openIdentModal(editId = null) {
  if (editId !== null && typeof editId !== 'string') editId = null;
  let p = null;
  if (editId) { p = getProcess(editId); if (!p) editId = null; }
  identModalMode = editId ? { mode: 'edit', id: editId } : { mode: 'new', id: null };

  if (p) {
    $('#modal-ident-title').textContent = 'Editar identificação';
    $('#btn-ident-confirm').textContent = 'Guardar';
    $('#ident-aluno').value = p.aluno;
    $('#ident-numero').value = p.numero;
    $('#ident-uc').value = p.uc;
    $('#ident-semestre').value = p.semestre;
  } else {
    $('#modal-ident-title').textContent = 'Novo processo';
    $('#btn-ident-confirm').textContent = 'Criar processo';
    $('#ident-aluno').value = '';
    $('#ident-numero').value = '';
    $('#ident-uc').value = '';
    $('#ident-semestre').value = '';
  }
  $('#ident-aluno').classList.remove('is-invalid');
  $('#ident-aluno-err').classList.remove('show');
  bootstrap.Modal.getOrCreateInstance($('#modal-ident')).show();
  setTimeout(() => $('#ident-aluno').focus(), 250);
}

function bindIdentModal() {
  $('#btn-ident-confirm').addEventListener('click', () => {
    const aluno = $('#ident-aluno').value.trim();
    if (!aluno) {
      $('#ident-aluno').classList.add('is-invalid');
      $('#ident-aluno-err').classList.add('show');
      $('#ident-aluno').focus();
      return;
    }
    const data = {
      aluno,
      numero: $('#ident-numero').value,
      uc: $('#ident-uc').value,
      semestre: $('#ident-semestre').value,
    };
    const modal = bootstrap.Modal.getOrCreateInstance($('#modal-ident'));

    if (identModalMode.mode === 'edit') {
      const p = getProcess(identModalMode.id);
      if (p) {
        Object.assign(p, { aluno: data.aluno, numero: data.numero.trim(), uc: data.uc.trim(), semestre: data.semestre.trim() });
        upsertProcess(p);
      }
      modal.hide();
      showToast('Identificação actualizada.');
      render();
    } else {
      // Duplicado?
      const all = loadAll();
      const dupe = all.find(x =>
        (x.aluno || '').toLowerCase() === data.aluno.toLowerCase() &&
        (x.uc || '').toLowerCase() === data.uc.trim().toLowerCase() &&
        (x.semestre || '').toLowerCase() === data.semestre.trim().toLowerCase()
      );
      if (dupe && !confirm(`Já existe um processo de "${dupe.aluno}"${dupe.uc ? ` para ${dupe.uc}` : ''}${dupe.semestre ? ` (${dupe.semestre})` : ''}.\n\nCriar mesmo assim?`)) {
        return;
      }
      const p = novoProcesso(data);
      if (!upsertProcess(p)) { modal.hide(); return; }
      modal.hide();
      openProcess(p.id);
      showToast('Processo criado.');
    }
  });

  $('#ident-aluno').addEventListener('input', () => {
    if ($('#ident-aluno').value.trim()) {
      $('#ident-aluno').classList.remove('is-invalid');
      $('#ident-aluno-err').classList.remove('show');
    }
  });
  $('#ident-aluno').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('#btn-ident-confirm').click(); }
  });
}

/* ═══════════════════════════════════════════════════════════
   EXPORT CSV
   ═══════════════════════════════════════════════════════════ */
function exportCSV() {
  const all = loadAll();
  if (!all.length) { showToast('Sem processos para exportar.', 'error'); return; }
  const headers = ['Criado','Actualizado','Aluno','Nº','UC','Semestre','Estado','MAC','CPF','NF1','NF1 (arr.)','Exame','NF2','NF2 (arr.)','Recurso','Resultado'];
  const rows = all.map(p => [
    fmtDate(p.criadoEm), fmtDate(p.actualizadoEm),
    p.aluno, p.numero, p.uc, p.semestre,
    estadoLabel(p),
    fmt(getMAC(p)), fmt(parseNum(p.cpf)),
    p.nf1 != null ? fmt(p.nf1) : '', p.nf1G ?? '',
    p.exame !== '' ? fmt(parseNum(p.exame)) : '',
    p.nf2 != null ? fmt(p.nf2) : '', p.nf2G ?? '',
    p.recurso !== '' ? fmt(parseNum(p.recurso)) : '',
    p.resultado || '',
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `processos-ugs-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exportado.');
}

/* ═══════════════════════════════════════════════════════════
   RENDER GLOBAL
   ═══════════════════════════════════════════════════════════ */
function render() {
  const navActions = $('.nav-actions');
  if (navActions) navActions.hidden = ui.view === 'edit';
  const v = $('#view');
  if (ui.view === 'edit') {
    const p = currentProcess();
    if (!p) { ui.view = 'list'; ui.activeId = null; try { sessionStorage.removeItem(SS_ACTIVE); } catch {} return render(); }
    v.innerHTML = renderEdit(p);
    bindEdit(p);
  } else {
    activeProcessRef = null;
    v.innerHTML = renderList();
    bindList();
  }
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
function init() {
  bindIdentModal();
  if (ui.activeId && !getProcess(ui.activeId)) {
    ui.activeId = null;
    try { sessionStorage.removeItem(SS_ACTIVE); } catch {}
  }
  if (ui.activeId) ui.view = 'edit';
  render();
}
init();
</script>
